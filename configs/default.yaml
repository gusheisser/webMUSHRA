# ================================
# MUSHRA multi-página (sin loop)
# ================================
testname: MUSHRA Guitar Plugins
testId: mushra_plugin
bufferSize: 2048
stopOnErrors: true
showButtonPreviousPage: true
//remoteService: null

pages:

  # ===== Página de bienvenida =====
  - type: generic
    id: intro
    name: "Bienvenida"
    content: |
      <h2>Test de Calidad Sonora - Guitar Plugins</h2>
      <p>Gracias por participar. En este test vas a evaluar la <b>calidad percibida</b> de distintos
      sonidos de guitarra generados con diferentes plugins, comparados con una <b>referencia real</b>.</p>

      <h3>Procedimiento</h3>
      <ul>
        <li>En cada página escucharás una referencia y una o más versiones procesadas.</li>
        <li>Usá los botones para conmutar entre estímulos y asignarles una puntuación de 0 (muy mala) a 100 (excelente).</li>
        <li>Podés escuchar los fragmentos todas las veces que necesites antes de calificar.</li>
        <li>Usá el selector de loop para comparar secciones específicas.</li>
        <li>Al finalizar cada conjunto, presioná <b>Siguiente</b>.</li>
      </ul>

      <h3>Duración total</h3>
      <p>El test completo toma aproximadamente 5 minutos. Al finalizar descargá los resultados para adjuntarlos en Google forms.</p>

      <p>Presioná <b>Comenzar</b> para iniciar el test.</p>

  # ===== Ítem 1 =====
  - type: mushra
    id: item1
    name: "Sexta al aire"
    content: "Evaluá la calidad relativa a la referencia."
    showWaveform: true
    enableLooping: true
    reference: configs/resources/audio/LTD_6.wav
    createAnchor35: false
    createAnchor70: false
    stimuli:
      C1:  configs/resources/audio/LTD_Synth_6.wav
      C2:  configs/resources/audio/Ample_6.wav
      C3:  configs/resources/audio/Wardman_6.wav
      Anchor: configs/resources/audio/Anchor_6.wav

  # ===== Ítem 2 =====
